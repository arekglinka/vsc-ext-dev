name: Devcontainer image

on:
  push:
    branches: [master]
    paths:
      - Dockerfile.devcontainer
      - .github/workflows/devcontainer-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.devcontainer
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-devcontainer:master
            ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-devcontainer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
