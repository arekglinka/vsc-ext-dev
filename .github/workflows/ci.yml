name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build, test, package (multistage, layer-cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: artifact
          outputs: type=local,dest=ci-out
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check artifact
        run: test -s ci-out/purs-graphs.vsix && ls -la ci-out/

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: purs-graphs-vsix
          path: ci-out/purs-graphs.vsix
